name = "carta-okapia"
main = "src/worker.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

routes = [
  { pattern = "carta.okapiagames.com/*", zone_name = "okapiagames.com" },
  { pattern = "cartain.okapiagames.com/*", zone_name = "okapiagames.com" },
]

# KV namespace — run: npx wrangler kv namespace create TRIVIA_KV
# then paste the id below
[[kv_namespaces]]
binding = "TRIVIA_KV"
id = "e3cfeee425ca4e2b94c72028d1353ceb"

# R2 bucket for shared postcards — strongly consistent reads, unlike KV,
# so WhatsApp/Twitter link-preview crawlers don't race a freshly uploaded image.
[[r2_buckets]]
binding = "POSTCARDS"
bucket_name = "carta-postcards"

# Set ANTHROPIC_API_KEY via: npx wrangler secret put ANTHROPIC_API_KEY
# Never put secrets in wrangler.toml

[vars]
ENVIRONMENT = "production"

# Fires at UTC midnight (day rollover) and again 15 min later to pre-generate
# and cache both editions' daily questions, so the first real visitor doesn't
# wait on generation. The second firing is a free no-op if the first already
# succeeded (getDailyQuestions checks cache first) and a cheap retry if not.
[triggers]
crons = ["0 0 * * *", "15 0 * * *"]
