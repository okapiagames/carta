name = "carta-okapia"
main = "src/worker.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

routes = [
  { pattern = "carta.okapiagames.com/*", zone_name = "okapiagames.com" },
  { pattern = "cartain.okapiagames.com/*", zone_name = "okapiagames.com" },
]

# KV namespace — run: npx wrangler kv namespace create TRIVIA_KV
# then paste the id below
[[kv_namespaces]]
binding = "TRIVIA_KV"
id = "e3cfeee425ca4e2b94c72028d1353ceb"

# R2 bucket for shared postcards — strongly consistent reads, unlike KV,
# so WhatsApp/Twitter link-preview crawlers don't race a freshly uploaded image.
[[r2_buckets]]
binding = "POSTCARDS"
bucket_name = "carta-postcards"

# Set ANTHROPIC_API_KEY via: npx wrangler secret put ANTHROPIC_API_KEY
# Never put secrets in wrangler.toml

[vars]
ENVIRONMENT = "production"

# Fires four times a day to pre-generate and cache both editions' daily
# questions, so the first real visitor never waits on generation:
#   0 0 / 15 0   — global edition's UTC midnight, + a 15-min-later retry
#   30 18 / 45 18 — India edition's IST midnight (IST = UTC+5:30, so IST
#                   00:00 is UTC 18:30 the previous day), + retry
# Every firing attempts both sites regardless of which schedule triggered it —
# getDailyQuestions is cache-first, so a firing for a site whose day hasn't
# rolled over yet is a free no-op.
[triggers]
crons = ["0 0 * * *", "15 0 * * *", "30 18 * * *", "45 18 * * *"]
